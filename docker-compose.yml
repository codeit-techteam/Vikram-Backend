services:
  postgres:
    image: postgres:16-alpine
    container_name: bajriwala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bajriwala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bajriwala}
      POSTGRES_DB: ${POSTGRES_DB:-bajriwala}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-bajriwala} -d ${POSTGRES_DB:-bajriwala}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bajriwala-network

  redis:
    image: redis:7-alpine
    container_name: bajriwala-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bajriwala-network

volumes:
  postgres_data:
    name: bajriwala-postgres-data
  redis_data:
    name: bajriwala-redis-data

networks:
  bajriwala-network:
    name: bajriwala-network
    driver: bridge
