# Bajriwala ERP — Redis configuration
# Docs: https://redis.io/docs/management/config/

bind 0.0.0.0
port 6379

# Persistence
appendonly yes
appendfsync everysec

# Memory — BullMQ requires noeviction (must not drop queue keys)
maxmemory 256mb
maxmemory-policy noeviction

# Security — set requirepass via REDIS_PASSWORD in production
# requirepass your-redis-password

protected-mode no
